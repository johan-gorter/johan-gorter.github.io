<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibecode Friday</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reset.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/theme/black.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/highlight/monokai.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <!-- Content lives in slides.md: "---" = next slide, "--" = vertical slide, "Note:" = speaker notes -->
        <section
          data-markdown="slides.md"
          data-separator="^\r?\n---\r?\n$"
          data-separator-vertical="^\r?\n--\r?\n$"
          data-separator-notes="^Note:"
        ></section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/highlight.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/notes.js"></script>
    <script>
      Reveal.initialize({
        hash: true,
        center: true,
        slideNumber: "c/t",
        transition: "slide",
        width: 1280,
        height: 720,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
      }).then(() => {
        // In markdown, `<!-- .element: class="fragment" -->` after **bold** or `code`
        // lands on that inline element; move it to the whole list item.
        document.querySelectorAll(".slides li > .fragment:not(li)").forEach((el) => {
          el.classList.remove("fragment");
          el.parentElement.classList.add("fragment");
        });
        // Reveal already numbered the fragments; drop those numbers so sync()
        // orders them again by their position on the slide.
        document.querySelectorAll(".slides [data-fragment-index]").forEach((el) => {
          el.removeAttribute("data-fragment-index");
        });
        Reveal.sync();
      });
    </script>
  </body>
</html>
