<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Video Intercom</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .save-btn {
            background: #4CAF50;
            color: white;
        }
        
        .save-btn:hover {
            background: #45a049;
        }
        
        .test-btn {
            background: #2196F3;
            color: white;
        }
        
        .test-btn:hover {
            background: #1976D2;
        }
        
        .cancel-btn {
            background: #666;
            color: white;
        }
        
        .cancel-btn:hover {
            background: #555;
        }
        
        #testResult {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        
        #testResult.success {
            background: #4CAF50;
            color: white;
        }
        
        #testResult.error {
            background: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Configure Video Intercom</h1>
    
    <form id="configForm">
        <div class="form-group">
            <label for="mode">Mode:</label>
            <select id="mode" name="mode">
                <option value="host">Host (Create Room)</option>
                <option value="join">Join (Connect to Room)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="roomId">Room ID:</label>
            <input type="text" id="roomId" name="roomId" placeholder="Enter room ID or leave empty to generate">
        </div>
        
        <div id="testResult"></div>
        
        <div class="button-group">
            <button type="button" class="test-btn" onclick="testConnection()">Test Connection</button>
            <button type="submit" class="save-btn">Save</button>
            <button type="button" class="cancel-btn" onclick="window.location.href='index.html'">Cancel</button>
        </div>
    </form>
    
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <script src="configure.js"></script>
</body>
</html>
